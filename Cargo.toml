[package]
name = "ms-tds"
version = "0.1.0"
edition = "2021"
rust-version = "1.74"
authors = ["zevs"]
license = "MIT"
repository = "https://github.com/icedracon/ms-tds"
documentation = "https://docs.rs/ms-tds"
description = "Pure-Rust TDS 7.4 client for Microsoft SQL Server — PreLogin, TLS-in-TDS handshake tunneling, Login7 with NTLM SSPI, SQLBatch, plus offensive primitives (xp_cmdshell, xp_dirtree UNC coerce, linked-server enum)"
readme = "README.md"
keywords = ["tds", "mssql", "sqlserver", "ntlm", "pentest"]
categories = ["database", "network-programming", "parser-implementations"]

[dependencies]
thiserror = "2"
ntlmssp = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util"] }
# `ring` backend keeps the build pure-Rust — `aws-lc-rs` (default) would pull cmake/nasm on Windows.
# `tls12` enables TLS 1.2 support (SQL Server 2016 and older Linux distros without TLS 1.3).
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
byteorder = "1"
bytes = "1"
encoding_rs = "0.8"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time"] }
# Test-only: generate a self-signed cert for the mock TDS+TLS server so the
# handshake exercised in tests/tls_tunnel.rs uses a real rustls state machine
# on both sides instead of a stub.
rcgen = { version = "0.13", default-features = false, features = ["pem", "ring"] }

[badges]
maintenance = { status = "experimental" }
